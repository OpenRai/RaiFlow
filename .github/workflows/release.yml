name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install stable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install OpenCL for tests
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev

      - name: Build Packages
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply changesets
        run: pnpm release:version

      - name: Publish packages through npm Trusted Publishing
        run: pnpm release

      - name: Push release commit and tags to main
        run: git push --atomic origin HEAD:refs/heads/main --tags
