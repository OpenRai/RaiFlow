<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch a Nano payment address</title>
  <style>
    body { font: 16px system-ui; max-width: 620px; margin: 4rem auto; padding: 0 1rem; color: #222; }
    label, input, button { display: block; width: 100%; box-sizing: border-box; }
    input, button { padding: .8rem; margin-top: .5rem; }
    form { display: grid; gap: 1rem; }
  </style>
</head>
<body>
  <h1>Watch an external Nano address</h1>
  <p>RaiFlow records confirmed payments and replays account events. It never holds this address's keys.</p>
  <form method="post" action="/watch">
    <label>Nano address
      <input name="address" required autocomplete="off" placeholder="nano_…">
    </label>
    <button type="submit">Start watching</button>
  </form>
</body>
</html>
