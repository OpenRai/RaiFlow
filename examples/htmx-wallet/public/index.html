<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RaiFlow customer deposits</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <main class="app-container glass-panel">
    <h1>Customer deposits and withdrawals</h1>
    <p>RaiFlow derives and operates the account. This browser only sees its Nano address and business reference.</p>
    <form hx-post="/customers" hx-target="#account-state" hx-swap="outerHTML">
      <label>Stable customer reference
        <input name="accountKey" required maxlength="120" autocomplete="off" placeholder="customer-123">
      </label>
      <button type="submit">Open customer account</button>
    </form>
    <section id="account-state" aria-live="polite"><p>Enter a customer reference to create or retrieve its reusable deposit account.</p></section>
  </main>
</body>
</html>
